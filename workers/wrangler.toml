name = "ssmug-checkin"
main = "checkin.js"
compatibility_date = "2024-09-23"

# Cloudflare KV namespace for profiles + check-ins.
# Run `wrangler kv namespace create CHECKINS` and paste the id below.
[[kv_namespaces]]
binding = "CHECKINS"
id = "REPLACE_WITH_KV_ID"

# Optional: set ADMIN_KEY in `wrangler secret put ADMIN_KEY` to protect /api/board
# [vars]
# ADMIN_KEY = "demo"
