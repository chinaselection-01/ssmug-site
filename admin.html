<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in Admin · SSMug Social Bottle</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .admin-wrap{max-width:820px;margin:40px auto;padding:0 20px}
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}
  .topbar h1{font-size:22px;margin:0}
  .topbar input{padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-size:14px;width:150px}
  .topbar button{background:var(--steel);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;box-shadow:var(--shadow)}
  .stat .n{font-size:30px;font-weight:800;color:var(--steel-d)}
  .stat .l{font-size:12px;color:#888;letter-spacing:1px;text-transform:uppercase}
  .list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .list .row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
  .list .row:last-child{border:none}
  .list .av{width:38px;height:38px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px}
  .list .nm{font-weight:700;color:var(--steel-d)}
  .list .meta{font-size:12px;color:#999}
  .list .tm{margin-left:auto;color:#999;font-size:12px}
  .badge-anon{background:#eee;color:#888;font-size:11px;padding:2px 8px;border-radius:20px}
  .badge-pub{background:#e3f3ea;color:#2e8b57;font-size:11px;padding:2px 8px;border-radius:20px}
  .empty{padding:30px;text-align:center;color:#aaa}
</style>
</head>
<body>
<div class="admin-wrap">
  <div class="topbar">
    <h1>📍 Check-in Admin</h1>
    <input id="locInput" value="CAFE001" placeholder="Location ID">
    <button onclick="load()">Load</button>
    <span class="muted" id="keyNote" style="font-size:12px"></span>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="sToday">0</div><div class="l">Today</div></div>
    <div class="stat"><div class="n" id="sTotal">0</div><div class="l">Total</div></div>
    <div class="stat"><div class="n" id="sPub">0</div><div class="l">Public</div></div>
  </div>

  <div class="list" id="list"><div class="empty">No check-ins for this location yet.</div></div>
</div>

<script>
const API = '/api';
function load(){
  const loc = document.getElementById('locInput').value.trim() || 'CAFE001';
  const key = new URLSearchParams(location.search).get('key');
  fetch(API + '/board?loc=' + encodeURIComponent(loc) + (key ? '&key='+key : ''))
    .then(r=>r.json())
    .then(d=>{
      const list = d.checkins || [];
      document.getElementById('sToday').textContent = d.today ?? list.length;
      document.getElementById('sTotal').textContent = d.total ?? list.length;
      document.getElementById('sPub').textContent   = d.public ?? list.filter(c=>c.public).length;
      if(!list.length){ document.getElementById('list').innerHTML = '<div class="empty">No check-ins for this location yet.</div>'; return; }
      document.getElementById('list').innerHTML = list.slice().reverse().map(c=>{
        const nm = c.public && c.name ? c.name : 'Anonymous';
        const av = c.avatar || '🥤';
        const tm = c.t ? new Date(c.t).toLocaleString() : '';
        const badge = c.public ? '<span class="badge-pub">public</span>' : '<span class="badge-anon">anon</span>';
        const meta = [c.mood ? c.mood : '', c.city ? c.city : ''].filter(Boolean).join(' · ');
        return '<div class="row"><div class="av">'+av+'</div><div><div class="nm">'+nm+' '+badge+'</div><div class="meta">'+meta+'</div></div><div class="tm">'+tm+'</div></div>';
      }).join('');
    })
    .catch(()=>{ document.getElementById('list').innerHTML = '<div class="empty">Backend not reachable. Deploy the Workers backend first.</div>'; });
}
load();
</script>
</body>
</html>
